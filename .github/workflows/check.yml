name: Application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:security
      - run: npm audit --audit-level=moderate
  python-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Audit exactly what the production image installs (Dockerfile: pip 26.3 plus
      # requirements.txt under the cloud lock), not the dev/test tools.
      - name: Resolve the production package set
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP/runtime/bin/python" -m pip install --upgrade pip==26.3
          "$RUNNER_TEMP/runtime/bin/python" -m pip install -r datemate/requirements.txt -c datemate/requirements-cloud.lock.txt
          "$RUNNER_TEMP/runtime/bin/python" -m pip freeze --all > "$RUNNER_TEMP/runtime-freeze.txt"
      - run: python -m pip install pip-audit==2.10.1
      # Ignored: chromadb 1.5.9 advisories with no fixed release. All four target the
      # Chroma HTTP server (its API, auth and RBAC providers); the app only uses the
      # in-process chromadb.PersistentClient (app/indexing.py) and never runs or
      # exposes a Chroma server. Re-check and drop these when chromadb ships a fix.
      #   PYSEC-2026-311  = CVE-2026-45829 / GHSA-f4j7-r4q5-qw2c (pre-auth code injection in the server)
      #   PYSEC-2026-3813 = CVE-2026-45830 / GHSA-2wm9-hf6c-p5cr (server authorization check)
      #   PYSEC-2026-3815 = CVE-2026-45831 / GHSA-xph7-9rjv-w5fr (SimpleRBACAuthorizationProvider)
      #   PYSEC-2026-3814 = CVE-2026-45833 / GHSA-36p7-vc44-83pf (authenticated code injection in the server)
      # Any other known vulnerability fails this job.
      - name: Audit production Python dependencies
        run: >-
          pip-audit --progress-spinner off --no-deps --disable-pip
          -r "$RUNNER_TEMP/runtime-freeze.txt"
          --ignore-vuln PYSEC-2026-311
          --ignore-vuln PYSEC-2026-3813
          --ignore-vuln PYSEC-2026-3815
          --ignore-vuln PYSEC-2026-3814
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        storage: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: datemate_test
          POSTGRES_PASSWORD: disposable-ci-check
          POSTGRES_DB: datemate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U datemate_test -d datemate_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: datemate
    env:
      DATEMATE_BROWSER_CHANNEL: chromium
      DATEMATE_TEST_DATABASE_URL: ${{ matrix.storage == 'postgres' && 'postgresql://datemate_test:disposable-ci-check@localhost:5432/datemate_test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: datemate/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pip check
      - run: python scripts/format_sources.py --check
      - run: python -m pytest tests -q
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install httpx==0.28.1
      - run: docker compose -f compose.test.yaml up -d --build
      - run: python datemate/scripts/check_cloud_containers.py
      - if: always()
        run: docker compose -f compose.test.yaml down
