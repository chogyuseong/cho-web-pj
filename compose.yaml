services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8080"
    env_file: datemate/.env
    environment:
      DATEMATE_RUNTIME: /data/runtime
      DATEMATE_BACKUP_DIR: /data/backups
      DATEMATE_BACKUP_INTERVAL_SECONDS: "3600"
    volumes:
      - datemate-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 120s
volumes:
  datemate-data:
