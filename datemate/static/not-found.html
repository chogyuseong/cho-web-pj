<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>페이지를 찾을 수 없어요 · 데이트메이트</title><link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<!-- 없는 주소를 브라우저로 열었을 때의 404 화면(2026-11-25 운영 QA-07). 앱(app/main.py http_error)과 Worker(cloudflare/edge.mjs notFound)가 같이 쓴다.
     스크립트 없이 이 파일 하나로 그린다(잠든 컨테이너 대신 Worker 가 답할 때도 같은 모양). -->
<style>
:root{color-scheme:light;--ink:#111827;--muted:#5B6472;--hong:#E0004D;--line:#E5E7EB;--platform:#F5F7FA}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--platform);color:var(--ink);font-family:Pretendard,system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;word-break:keep-all}
main{width:100%;max-width:460px;padding:32px 24px;border:1px solid var(--line);border-radius:20px;background:#fff;text-align:center}
.code{margin:0;font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--hong)}
h1{margin:8px 0 12px;font-size:24px;line-height:1.35}
p{margin:0 0 12px;font-size:16px;color:var(--muted)}
a.home{display:inline-flex;align-items:center;justify-content:center;min-height:48px;margin-top:12px;padding:0 22px;border-radius:999px;background:var(--hong);color:#fff;font-size:16px;font-weight:700;text-decoration:none}
a.home:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
</style></head>
<body><main><p class="code">404</p><h1>찾는 페이지가 없어요</h1><p>주소가 바뀌었거나 잘못 입력된 것 같아요. 공유받은 코스라면 받은 링크 전체가 그대로 열렸는지 확인해 주세요.</p><a class="home" href="/">데이트메이트 처음 화면으로</a></main></body></html>
